name: CI pipeline

#TRIGGER : run on pushes on pull request to main
on:
  push:
    branches: [ main ] 
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest  # fresh VM from Github
    steps:
      - name: Checkout code   #download the repo
        uses: actions/checkout@v4   #go to actions and buils a block at checkout@4(version 4 action)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"  
          run: pip install -r requirements.txt

      - name: Run tests   # a failure here turns the pipeline red
        run : pytest -v